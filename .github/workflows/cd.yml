name: Backend CD

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build_and_push:
    name: Build and push production image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image reference
        id: image_meta
        run: |
          IMAGE_PATH="$IMAGE_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/${IMAGE_PATH}"

          echo "image_latest=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${IMAGE_NAME}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.image_latest }}
            ${{ steps.image_meta.outputs.image_sha }}

  deploy_production:
    name: Deploy to production
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPOSITORY,DEPLOY_PATH,COMMIT_SHA
          script: |
            set -e

            echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
            unset DOCKER_PASSWORD
            cd "$DEPLOY_PATH"

            IMAGE_PATH="$DOCKER_REPOSITORY"
            if [[ "$IMAGE_PATH" != */* ]]; then
              IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
            fi
            SHORT_SHA="${COMMIT_SHA::7}"
            export BACKEND_IMAGE="${DOCKER_REGISTRY}/${IMAGE_PATH}:sha-${SHORT_SHA}"

            if [ ! -f ".env.production" ]; then
              echo "ERROR: .env.production not found in $DEPLOY_PATH"
              exit 1
            fi
            if ! grep -Eq '^POSTGRES_DB=.+' .env.production || \
               ! grep -Eq '^POSTGRES_USER=.+' .env.production || \
               ! grep -Eq '^POSTGRES_PASSWORD=.+' .env.production; then
              echo "ERROR: POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD must be set in .env.production"
              exit 1
            fi

            # Pin BACKEND_IMAGE on disk so compose (backend + celery) matches this deploy; avoids
            # drift when .env had :latest while CI deployed :sha-<commit>.
            grep -v '^BACKEND_IMAGE=' .env.production > .env.production.tmp
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> .env.production.tmp
            mv .env.production.tmp .env.production

            docker pull "$BACKEND_IMAGE"

            docker rm -f nlh_backend_prod nlh_nginx_prod nlh_celery_prod 2>/dev/null || true
            # Recreate backend, nginx, and celery so all use the same freshly pulled BACKEND_IMAGE.
            # `docker compose restart celery` is NOT enough: restart keeps the old container image.
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate --remove-orphans backend nginx celery

            echo "Waiting for backend container to finish migrate + gunicorn startup..."
            for i in $(seq 1 60); do
              if docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend python -c "import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', 8000)); s.close()" >/dev/null 2>&1; then
                echo "Backend is ready after ${i}s"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "ERROR: backend did not become ready within 60s"
                docker compose --env-file .env.production -f docker-compose.prod.yml logs backend | tail -40
                exit 1
              fi
              sleep 1
            done

            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput || echo "WARNING: collectstatic failed"

            echo "=== Production deploy complete ==="
            echo "Image: $BACKEND_IMAGE"
            docker compose --env-file .env.production -f docker-compose.prod.yml ps

  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: [build_and_push, deploy_production]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: Send Slack message
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.deploy_production.result == 'success' && ':rocket: Deployed to PRODUCTION' || ':x: Production deploy FAILED' }} *${{ github.repository }}*\n*Branch:* `main`\n*Commit:* `${{ github.sha }}`\n*Actor:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
