name: Backend CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run linting
        run: flake8 apps/ config/ --max-line-length=120 --exclude=migrations

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          SECRET_KEY: test-secret-key
        run: |
          python manage.py migrate
          pytest --cov-report=xml

  build_and_push:
    name: Build and push Docker image
    needs: quality
    runs-on: ubuntu-latest
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false

    steps:
      - uses: actions/checkout@v4

      - name: Build image reference
        id: image_meta
        run: |
          IMAGE_PATH="$IMAGE_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"
          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/${IMAGE_PATH}"

          echo "image_ref=${IMAGE_NAME}:pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.image_ref }}

  deploy_preview:
    name: Deploy PR preview
    needs: build_and_push
    runs-on: ubuntu-latest
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy preview via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPOSITORY,DEPLOY_PATH,PR_NUMBER
          script: |
            set -e

            PR_SLUG="pr-${PR_NUMBER}"
            PREVIEW_PORT=$((10000 + PR_NUMBER))
            PREVIEW_DB_NAME="nlh_pr${PR_NUMBER}"
            NGINX_CONF="/etc/nginx/sites-available/${PR_SLUG}.staging.newlevelhub.kz"

            # Build image ref locally to avoid GitHub Actions masked-output issue
            IMAGE_PATH="$DOCKER_REPOSITORY"
            if [[ "$IMAGE_PATH" != */* ]]; then
              IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
            fi
            BACKEND_IMAGE="${DOCKER_REGISTRY}/${IMAGE_PATH}:pr-${PR_NUMBER}"

            echo "--- [0/5] Writing docker-compose.preview.yml to server ---"
            mkdir -p "$DEPLOY_PATH"
            cat > "$DEPLOY_PATH/docker-compose.preview.yml" << 'COMPOSEOF'
            # Per-PR preview environment — written by CI
            services:
              db:
                image: postgres:15-alpine
                env_file:
                  - .env.staging
                environment:
                  POSTGRES_DB: ${PREVIEW_DB_NAME}
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlh_user} -d ${POSTGRES_DB}"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                restart: unless-stopped

              backend:
                image: ${BACKEND_IMAGE}
                command: gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 120 config.wsgi:application
                env_file:
                  - .env.staging
                environment:
                  DJANGO_SETTINGS_MODULE: config.settings.production
                  DEBUG: "True"
                  POSTGRES_DB: ${PREVIEW_DB_NAME}
                  POSTGRES_HOST: db
                  ALLOWED_HOSTS: "${PR_SLUG}.staging.newlevelhub.kz"
                  CORS_ALLOWED_ORIGINS: "https://${PR_SLUG}.staging.newlevelhub.kz"
                  FRONTEND_URL: "https://${PR_SLUG}.staging.newlevelhub.kz"
                  SECURE_SSL_REDIRECT: "False"
                ports:
                  - "${PREVIEW_PORT}:8000"
                volumes:
                  - static_volume:/app/staticfiles
                  - media_volume:/app/media
                depends_on:
                  db:
                    condition: service_healthy
                restart: unless-stopped

            volumes:
              postgres_data:
              static_volume:
              media_volume:
            COMPOSEOF

            echo "--- [1/5] Docker: pull & deploy containers ---"
            echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
            cd "$DEPLOY_PATH"

            if [ ! -f ".env.staging" ]; then
              echo "ERROR: .env.staging not found in $DEPLOY_PATH"
              exit 1
            fi

            docker pull "$BACKEND_IMAGE"

            export PR_SLUG PREVIEW_DB_NAME BACKEND_IMAGE PREVIEW_PORT
            docker compose \
              --project-name "$PR_SLUG" \
              --env-file .env.staging \
              -f docker-compose.preview.yml \
              up -d --force-recreate

            echo "--- [2/5] Waiting for DB to be healthy ---"
            sleep 10

            echo "--- [3/5] Running migrations ---"
            # Check that the backend container is actually running before exec
            BACKEND_CONTAINER="${PR_SLUG}-backend-1"
            if docker inspect --format='{{.State.Running}}' "$BACKEND_CONTAINER" 2>/dev/null | grep -q true; then
              timeout 120 docker compose \
                --project-name "$PR_SLUG" \
                -f docker-compose.preview.yml \
                exec -T backend python manage.py migrate --noinput \
                || echo "WARNING: migrate failed or timed out — continuing"
            else
              echo "WARNING: backend container is not running, skipping migrate"
              docker compose --project-name "$PR_SLUG" -f docker-compose.preview.yml logs backend | tail -20
            fi

            echo "--- [4/5] Writing nginx config ---"
            sudo tee "$NGINX_CONF" > /dev/null << NGINXEOF
            server {
                listen 80;
                server_name ${PR_SLUG}.staging.newlevelhub.kz;

                location / {
                    proxy_pass http://127.0.0.1:${PREVIEW_PORT};
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 300;
                    client_max_body_size 20M;
                }
            }
            NGINXEOF

            sudo ln -sf "$NGINX_CONF" "/etc/nginx/sites-enabled/${PR_SLUG}.staging.newlevelhub.kz"
            sudo nginx -t && sudo nginx -s reload

            echo "--- [5/5] Getting SSL certificate ---"
            sleep 2
            sudo certbot --nginx \
              -d "${PR_SLUG}.staging.newlevelhub.kz" \
              --non-interactive \
              --agree-tos \
              -m "admin@newlevelhub.kz" \
              --redirect \
              2>&1 | tail -10

            echo ""
            echo "=== Preview deployed successfully ==="
            echo "URL:    https://${PR_SLUG}.staging.newlevelhub.kz"
            echo "Docs:   https://${PR_SLUG}.staging.newlevelhub.kz/api/docs/"
            echo "Port:   ${PREVIEW_PORT}"

      - name: Post preview URL comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const slug = `pr-${prNumber}`;
            const baseUrl = `https://${slug}.staging.newlevelhub.kz`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            const branch = '${{ github.head_ref }}';

            const body = [
              `## 🚀 Preview Environment`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Status** | ✅ Deployed |`,
              `| **API Base** | \`${baseUrl}/api/v1/\` |`,
              `| **Swagger** | [${baseUrl}/api/docs/](${baseUrl}/api/docs/) |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Commit** | \`${sha}\` |`,
              ``,
              `> Preview автоматически удалится когда PR будет закрыт.`,
              ``,
              `[View deploy run](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## 🚀 Preview Environment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  destroy_preview:
    name: Destroy PR preview
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.fork == false
    environment: staging

    steps:
      - name: Destroy preview via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DEPLOY_PATH,PR_NUMBER
          script: |
            PR_SLUG="pr-${PR_NUMBER}"
            NGINX_CONF="/etc/nginx/sites-available/${PR_SLUG}.staging.newlevelhub.kz"

            echo "--- [1/3] Stopping Docker containers ---"
            cd "$DEPLOY_PATH"
            if [ -f "docker-compose.preview.yml" ]; then
              docker compose \
                --project-name "$PR_SLUG" \
                -f docker-compose.preview.yml \
                down -v --remove-orphans \
                2>/dev/null || true
            fi

            # Fallback: remove any leftover resources by project label
            CONTAINERS=$(docker ps -a --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$CONTAINERS" ]; then
              docker stop $CONTAINERS 2>/dev/null || true
              docker rm $CONTAINERS 2>/dev/null || true
            fi
            VOLUMES=$(docker volume ls --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$VOLUMES" ]; then
              docker volume rm $VOLUMES 2>/dev/null || true
            fi

            echo "--- [2/3] Removing nginx config ---"
            sudo rm -f "$NGINX_CONF" "/etc/nginx/sites-enabled/${PR_SLUG}.staging.newlevelhub.kz"
            sudo nginx -t && sudo nginx -s reload

            echo "--- [3/3] Deleting SSL certificate ---"
            sudo certbot delete \
              --cert-name "${PR_SLUG}.staging.newlevelhub.kz" \
              --non-interactive \
              2>/dev/null || echo "Cert not found or already deleted."

            echo ""
            echo "=== Preview destroyed: ${PR_SLUG} ==="

      - name: Update PR comment on destroy
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const merged = '${{ github.event.pull_request.merged }}' === 'true';
            const action = merged ? 'merged ✅' : 'closed';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## 🚀 Preview Environment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: existing.body
                  .replace('✅ Deployed', `🗑️ Destroyed (PR ${action})`)
                  .replace('> Preview автоматически удалится когда PR будет закрыт.', ''),
              });
            }

  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: [quality, build_and_push, deploy_preview]
    if: |
      always() &&
      github.event.pull_request.draft == false &&
      github.event.action != 'closed'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: Send Slack message
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.deploy_preview.result == 'success' && ':rocket: Preview deployed' || needs.build_and_push.result == 'success' && ':warning: Built OK but preview deploy failed' || ':x: CI FAILED' }} *${{ github.repository }}*\n*Branch:* `${{ github.head_ref }}`\n*PR:* ${{ github.event.pull_request.title }}\n*Actor:* ${{ github.actor }}\n*Preview:* https://pr-${{ github.event.pull_request.number }}.staging.newlevelhub.kz\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
