groups:
  - name: server
    interval: 30s
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Server metrics exporter is down"
          description: "node_exporter is unreachable — host may be down or monitoring agent failed."

      - alert: HostHighCPU
        expr: |
          100 - (
            avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100
          ) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on server"
          description: "CPU usage is above 90% for more than 10 minutes."

      - alert: HostHighMemory
        expr: |
          (
            1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
          ) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on server"
          description: "Memory usage is above 90%."

      - alert: HostDiskAlmostFull
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|autofs", mountpoint!~"/boot.*"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|autofs", mountpoint!~"/boot.*"}
          ) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space running low"
          description: "Less than 15% disk space left on {{ $labels.mountpoint }}."

      - alert: MonitoringTargetDown
        expr: up{job=~"node|compose"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Monitoring target {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }}/{{ $labels.instance }}."
