services:
  db:
    image: postgres:15-alpine
    container_name: nlh_db_staging
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nlh_network_staging

  backend:
    image: ${BACKEND_IMAGE}
    container_name: nlh_backend_staging
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 config.wsgi:application
    volumes:
      - static_volume_staging:/app/staticfiles
      - media_volume_staging:/app/media
    expose:
      - "8000"
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - nlh_network_staging

  nginx:
    image: nginx:alpine
    container_name: nlh_nginx_staging
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume_staging:/app/staticfiles:ro
      - media_volume_staging:/app/media:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
    networks:
      - nlh_network_staging

volumes:
  postgres_data_staging:
    driver: local
  static_volume_staging:
  media_volume_staging:

networks:
  nlh_network_staging:
    driver: bridge
