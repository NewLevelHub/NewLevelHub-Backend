# Per-PR preview environment template.
# CI copies this file to the staging server as docker-compose.<PR_SLUG>.yml and runs:
#   docker compose --project-name <PR_SLUG> -f docker-compose.<PR_SLUG>.yml up -d
#
# Required env vars at runtime: PR_SLUG, PREVIEW_DB_NAME, BACKEND_IMAGE, PREVIEW_PORT
# Optional: PREVIEW_LOG_FILTER (CI sets to dev-XXX ticket to include matching frontend nlh_fe_* containers)
# Optional: FRONTEND_URL (CI may override with matched fe-* preview URL)
# BACKEND_URL is always https://${PR_SLUG}.staging.newlevelhub.kz (API + email QR images)
# Base secrets loaded from .env.staging on the server.
#
# Postgres is NOT included here — all PRs share the single nlh_staging_postgres instance
# (see docker-compose.staging-db.yml). The CI script creates/drops each PR's database
# (nlh_pr<N>) from the nlh_seed template before/after deploy.

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    mem_limit: 512m
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 120 config.wsgi:application"
    labels:
      - "com.newlevelhub.test=compose-scp-verified"
    env_file:
      - .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_DB: ${PREVIEW_DB_NAME}
      POSTGRES_HOST: nlh_staging_postgres
      ALLOWED_HOSTS: "${PR_SLUG}.staging.newlevelhub.kz,localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "https://${PR_SLUG}.staging.newlevelhub.kz"
      CSRF_TRUSTED_ORIGINS: "https://${PR_SLUG}.staging.newlevelhub.kz,https://*.staging.newlevelhub.kz"
      FRONTEND_URL: "${FRONTEND_URL:-https://${PR_SLUG}.staging.newlevelhub.kz}"
      BACKEND_URL: "https://${PR_SLUG}.staging.newlevelhub.kz"
      SECURE_SSL_REDIRECT: "False"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      # MinIO endpoint uses the "staging-minio" network alias defined in
      # docker-compose.staging-db.yml. All PR preview containers join staging_network
      # so this hostname resolves to the shared nlh_staging_minio container.
      AWS_S3_ENDPOINT_URL: "http://staging-minio:9000"
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - staging_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/preview.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "${PREVIEW_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/users.yml:/data/users.yml:ro
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_BASE: /dozzle
      DOZZLE_FILTER: name=${PREVIEW_LOG_FILTER:-${PR_SLUG}}
    expose:
      - "8080"
    restart: unless-stopped

  celery:
    image: ${BACKEND_IMAGE}
    mem_limit: 256m
    command: celery -A config.celery worker --loglevel=info --concurrency=1
    env_file:
      - .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_DB: ${PREVIEW_DB_NAME}
      POSTGRES_HOST: nlh_staging_postgres
      ALLOWED_HOSTS: "${PR_SLUG}.staging.newlevelhub.kz,localhost,127.0.0.1"
      FRONTEND_URL: "${FRONTEND_URL:-https://${PR_SLUG}.staging.newlevelhub.kz}"
      BACKEND_URL: "https://${PR_SLUG}.staging.newlevelhub.kz"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      AWS_S3_ENDPOINT_URL: "http://staging-minio:9000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - staging_network
    restart: unless-stopped

  celery_beat:
    image: ${BACKEND_IMAGE}
    mem_limit: 128m
    command: celery -A config.celery beat --loglevel=info
    env_file:
      - .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_DB: ${PREVIEW_DB_NAME}
      POSTGRES_HOST: nlh_staging_postgres
      ALLOWED_HOSTS: "${PR_SLUG}.staging.newlevelhub.kz,localhost,127.0.0.1"
      FRONTEND_URL: "${FRONTEND_URL:-https://${PR_SLUG}.staging.newlevelhub.kz}"
      BACKEND_URL: "https://${PR_SLUG}.staging.newlevelhub.kz"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      AWS_S3_ENDPOINT_URL: "http://staging-minio:9000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - staging_network
    restart: unless-stopped

networks:
  default: {}
  staging_network:
    external: true
    name: staging_network

volumes:
  static_volume:
  media_volume:
