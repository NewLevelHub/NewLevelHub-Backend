name: Backend CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run linting
        run: flake8 apps/ config/ --max-line-length=120 --exclude=migrations

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          SECRET_KEY: test-secret-key
        run: |
          python manage.py migrate
          pytest --cov-report=xml

  build_and_push:
    name: Build and push Docker image
    needs: quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    outputs:
      image_ref: ${{ steps.image_meta.outputs.image_ref }}
      ticket: ${{ steps.image_meta.outputs.ticket }}

    steps:
      - uses: actions/checkout@v4

      - name: Build image reference
        id: image_meta
        run: |
          IMAGE_PATH="$IMAGE_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi

          TICKET="$(echo "${{ github.head_ref }}" | grep -Eo '[A-Za-z]+-[0-9]+' | head -n1 || true)"
          TICKET="${TICKET:-TICKET}"
          TICKET="$(echo "$TICKET" | tr '[:lower:]' '[:upper:]')"

          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/${IMAGE_PATH}"
          echo "image_ref=${IMAGE_NAME}:${TICKET}" >> "$GITHUB_OUTPUT"
          echo "ticket=${TICKET}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.image_ref }}

  deploy_staging:
    name: Deploy to staging
    needs: build_and_push
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKEND_IMAGE: ${{ needs.build_and_push.outputs.image_ref }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DEPLOY_PATH,BACKEND_IMAGE
          script: |
            set -e

            echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
            cd "$DEPLOY_PATH"

            if [ ! -f "docker-compose.staging.yml" ]; then
              echo "ERROR: docker-compose.staging.yml not found in $DEPLOY_PATH"
              ls -la
              exit 1
            fi
            if [ ! -f ".env.staging" ]; then
              echo "ERROR: .env.staging not found in $DEPLOY_PATH"
              exit 1
            fi

            export BACKEND_IMAGE="$BACKEND_IMAGE"
            docker pull "$BACKEND_IMAGE"

            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --force-recreate backend nginx
            sleep 5

            docker compose --env-file .env.staging -f docker-compose.staging.yml exec -T backend python manage.py migrate --noinput || echo "WARNING: migrate failed"
            docker compose --env-file .env.staging -f docker-compose.staging.yml exec -T backend python manage.py collectstatic --noinput || echo "WARNING: collectstatic failed"

            echo "=== Staging deploy complete ==="
            echo "Image: $BACKEND_IMAGE"
            docker compose --env-file .env.staging -f docker-compose.staging.yml ps

  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: [quality, build_and_push, deploy_staging]
    if: always() && github.event.pull_request.draft == false
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: Send Slack message
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.deploy_staging.result == 'success' && ':white_check_mark: Deployed to STAGING' || needs.build_and_push.result == 'success' && ':warning: Built OK but staging deploy failed' || ':x: CI FAILED' }} *${{ github.repository }}*\n*Branch:* `${{ github.head_ref }}`\n*Ticket:* `${{ needs.build_and_push.outputs.ticket || 'N/A' }}`\n*Actor:* ${{ github.actor }}\n*PR:* ${{ github.event.pull_request.title }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
