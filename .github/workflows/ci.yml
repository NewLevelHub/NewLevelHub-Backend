name: Backend CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

# New pushes to the same PR cancel older in-progress runs.
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false
    outputs:
      quality_changed: ${{ steps.filter.outputs.quality }}
      deploy_changed: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            quality:
              - 'apps/**'
              - 'config/**'
              - 'templates/**'
              - 'manage.py'
              - 'requirements*.txt'
              - 'setup.cfg'
            deploy:
              - 'apps/**'
              - 'config/**'
              - 'templates/**'
              - 'Dockerfile'
              - 'docker-compose.preview.yml'
              - 'manage.py'
              - 'requirements*.txt'
              - 'setup.cfg'
              - '.github/workflows/ci.yml'
              - 'nginx/preview.conf'

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    if: |
      needs.changes.outputs.quality_changed == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install flake8
        run: pip install flake8

      - name: Run linting
        run: flake8 apps/ config/ --max-line-length=120 --exclude=migrations

  tests:
    name: Tests
    needs: changes
    runs-on: ubuntu-latest
    if: |
      needs.changes.outputs.quality_changed == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Determine test scope
        id: scope
        run: |
          if [[ "${{ github.event.action }}" == "synchronize" ]]; then
            CHANGED=$(git diff HEAD~1 HEAD --name-only)
            echo "Changed files in last commit:"
            echo "$CHANGED"
            PATHS=""
            while IFS= read -r file; do
              if [[ "$file" =~ ^apps/([^/]+)/ ]]; then
                app="${BASH_REMATCH[1]}"
                if [ -d "apps/${app}/tests" ]; then
                  PATHS="${PATHS} apps/${app}/tests"
                fi
              fi
            done <<< "$CHANGED"
            PATHS=$(echo "$PATHS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
            if [ -z "$PATHS" ]; then
              echo "run=skip" >> "$GITHUB_OUTPUT"
              echo "No app test directories affected — skipping tests"
            else
              echo "run=partial" >> "$GITHUB_OUTPUT"
              echo "paths=$PATHS" >> "$GITHUB_OUTPUT"
              echo "Partial run: $PATHS"
            fi
          else
            echo "run=full" >> "$GITHUB_OUTPUT"
            echo "Full test run (action: ${{ github.event.action }})"
          fi

      - name: Set up Python
        if: steps.scope.outputs.run != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.scope.outputs.run != 'skip'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        if: steps.scope.outputs.run != 'skip'
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          SECRET_KEY: test-secret-key
        run: |
          python manage.py migrate
          if [[ "${{ steps.scope.outputs.run }}" == "partial" ]]; then
            echo "Running partial tests: ${{ steps.scope.outputs.paths }}"
            pytest --no-cov -q -n auto ${{ steps.scope.outputs.paths }}
          else
            pytest --no-cov -q -n auto
          fi

  build_and_push:
    name: Build and push Docker image
    needs: [changes, lint, tests]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.changes.outputs.deploy_changed == 'true' &&
      (needs.changes.outputs.quality_changed != 'true' || (needs.lint.result == 'success' && needs.tests.result == 'success')) &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false

    steps:
      - uses: actions/checkout@v4

      - name: Build image reference
        id: image_meta
        run: |
          IMAGE_PATH="$IMAGE_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"
          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/${IMAGE_PATH}"

          echo "image_ref=${IMAGE_NAME}:pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_preview:
    name: Deploy PR preview
    needs: [changes, build_and_push]
    runs-on: ubuntu-latest
    if: |
      needs.changes.outputs.deploy_changed == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose template and nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.preview.yml,nginx/preview.conf"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy preview via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPOSITORY,DEPLOY_PATH,PR_NUMBER,BRANCH_NAME
          script: |
            set -e

            TICKET=$(echo "$BRANCH_NAME" | grep -oE 'dev-[0-9]+' | head -1)
            if [ -z "$TICKET" ]; then TICKET="noticket"; fi
            PR_SLUG="be-${TICKET}-pr${PR_NUMBER}"
            PREVIEW_PORT=$((10000 + PR_NUMBER))
            if [ "$PREVIEW_PORT" -gt 10999 ]; then
              echo "ERROR: PR number ${PR_NUMBER} exceeds port range (max port 10999). Refusing to deploy."
              exit 1
            fi
            if ss -tlnp 2>/dev/null | grep -q ":${PREVIEW_PORT} " || \
               ss -tlnp 2>/dev/null | grep -q ":${PREVIEW_PORT}$"; then
              echo "WARNING: port ${PREVIEW_PORT} appears to be in use — checking if it belongs to this PR..."
              if ! docker compose --project-name "$PR_SLUG" ps 2>/dev/null | grep -q "Up"; then
                echo "ERROR: port ${PREVIEW_PORT} is occupied by another process. Refusing to deploy."
                exit 1
              fi
            fi
            PREVIEW_DB_NAME="nlh_pr${PR_NUMBER}"
            NGINX_CONF="/etc/nginx/sites-available/${PR_SLUG}.staging.newlevelhub.kz"

            # Build image ref locally to avoid GitHub Actions masked-output issue
            IMAGE_PATH="$DOCKER_REPOSITORY"
            if [[ "$IMAGE_PATH" != */* ]]; then
              IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
            fi
            BACKEND_IMAGE="${DOCKER_REGISTRY}/${IMAGE_PATH}:pr-${PR_NUMBER}"

            COMPOSE_FILE="$DEPLOY_PATH/docker-compose.${PR_SLUG}.yml"

            echo "--- [0/5] Copying compose template for ${PR_SLUG} ---"
            mkdir -p "$DEPLOY_PATH"
            cp "$DEPLOY_PATH/docker-compose.preview.yml" "$COMPOSE_FILE"

            echo "--- [1/5] Docker: pull image ---"
            echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
            unset DOCKER_PASSWORD
            cd "$DEPLOY_PATH"

            if [ ! -f ".env.staging" ]; then
              echo "ERROR: .env.staging not found in $DEPLOY_PATH"
              exit 1
            fi

            docker pull "$BACKEND_IMAGE"

            echo "--- [2/5] Preparing PR database ---"
            PG_USER=$(grep -E '^POSTGRES_USER=' .env.staging | head -1 | cut -d= -f2 | tr -d "' \"")
            PG_USER="${PG_USER:-nlh_user}"

            # Ensure seed database exists (created once, QA fills it with test data)
            if ! docker exec nlh_staging_postgres psql -U "$PG_USER" -d postgres -tc \
                "SELECT 1 FROM pg_database WHERE datname='nlh_seed'" 2>/dev/null | grep -q 1; then
              echo "Seed database not found — creating nlh_seed..."
              docker exec nlh_staging_postgres psql -U "$PG_USER" -d postgres \
                -c "CREATE DATABASE nlh_seed;"
            fi

            # Create PR database from seed template if it doesn't exist yet.
            # On re-deploys (new commits to the same PR) we skip creation to preserve QA data.
            if ! docker exec nlh_staging_postgres psql -U "$PG_USER" -d postgres -tc \
                "SELECT 1 FROM pg_database WHERE datname='$PREVIEW_DB_NAME'" 2>/dev/null | grep -q 1; then
              echo "Creating database $PREVIEW_DB_NAME from seed template..."
              docker exec nlh_staging_postgres psql -U "$PG_USER" -d postgres \
                -c "CREATE DATABASE $PREVIEW_DB_NAME TEMPLATE nlh_seed;"
            else
              echo "Database $PREVIEW_DB_NAME already exists — keeping existing data"
            fi

            # Email links must always point to frontend (not backend preview).
            DEFAULT_FRONTEND_URL=$(grep -E '^FRONTEND_URL=' .env.staging | head -1 | cut -d= -f2- | tr -d "' \"")
            FRONTEND_URL="${DEFAULT_FRONTEND_URL:-https://staging.newlevelhub.kz}"
            if [ "$TICKET" != "noticket" ]; then
              MATCHED_FE_SLUG=$(docker ps --format '{{.Names}}' \
                | sed -n "s/^nlh_fe_\\(fe-${TICKET}-pr[0-9][0-9]*\\)$/\\1/p" \
                | awk '{ pr = $0; sub(/^.*-pr/, "", pr); print pr " " $0 }' \
                | sort -nr \
                | awk 'NR==1 { print $2 }')
              if [ -n "$MATCHED_FE_SLUG" ]; then
                FRONTEND_URL="https://${MATCHED_FE_SLUG}.staging.newlevelhub.kz"
                echo "Using matched frontend preview for ticket ${TICKET}: ${FRONTEND_URL}"
              else
                echo "WARNING: no running frontend preview matched ticket ${TICKET}; using fallback FRONTEND_URL=${FRONTEND_URL}"
              fi
            else
              echo "No ticket in branch name; using fallback FRONTEND_URL=${FRONTEND_URL}"
            fi

            BACKEND_URL="https://${PR_SLUG}.staging.newlevelhub.kz"
            echo "Backend API URL for this preview: ${BACKEND_URL}"

            echo "--- [3/5] Docker: deploy containers ---"
            export PR_SLUG PREVIEW_DB_NAME BACKEND_IMAGE PREVIEW_PORT FRONTEND_URL BACKEND_URL
            docker compose \
              --project-name "$PR_SLUG" \
              --env-file .env.staging \
              -f "$COMPOSE_FILE" \
              up -d --force-recreate

            echo "--- [4/5] Waiting for backend to finish startup (migrate + collectstatic + gunicorn) ---"
            BACKEND_CONTAINER="${PR_SLUG}-backend-1"
            READY=0
            MAX_WAIT_SECONDS=120
            POLL_INTERVAL=2
            MAX_ATTEMPTS=$((MAX_WAIT_SECONDS / POLL_INTERVAL))
            for i in $(seq 1 "$MAX_ATTEMPTS"); do
              IS_RUNNING=$(docker inspect --format='{{.State.Running}}' "$BACKEND_CONTAINER" 2>/dev/null || echo "false")
              # Use Python socket probe (more reliable than nc availability in image).
              if docker exec "$BACKEND_CONTAINER" python -c "import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', 8000)); s.close()" >/dev/null 2>&1; then
                echo "Backend is ready after $((i * POLL_INTERVAL))s"
                READY=1
                break
              fi
              if [ "$IS_RUNNING" != "true" ]; then
                echo "ERROR: backend container stopped unexpectedly"
                docker compose --project-name "$PR_SLUG" -f "$COMPOSE_FILE" logs backend | tail -60
                exit 1
              fi
              if [ $((i % 5)) -eq 0 ]; then
                echo "Waiting for backend... (${i}/${MAX_ATTEMPTS})"
              fi
              sleep "$POLL_INTERVAL"
            done
            if [ "$READY" -ne 1 ]; then
              echo "ERROR: backend did not become ready in ${MAX_WAIT_SECONDS}s"
              docker compose --project-name "$PR_SLUG" -f "$COMPOSE_FILE" logs backend | tail -80
              exit 1
            fi

            echo "--- [5a/5] Writing nginx config ---"
            sudo tee "$NGINX_CONF" > /dev/null << NGINXEOF
            server {
                listen 80;
                server_name ${PR_SLUG}.staging.newlevelhub.kz;

                location / {
                    proxy_pass http://127.0.0.1:${PREVIEW_PORT};
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 300;
                    client_max_body_size 100M;
                }
            }
            NGINXEOF

            sudo ln -sf "$NGINX_CONF" "/etc/nginx/sites-enabled/${PR_SLUG}.staging.newlevelhub.kz"
            sudo nginx -t && sudo nginx -s reload

            echo "--- [5b/5] Ensuring SSL certificate ---"
            CERT_PATH="/etc/letsencrypt/live/${PR_SLUG}.staging.newlevelhub.kz/fullchain.pem"
            if [ -f "$CERT_PATH" ]; then
              echo "Certificate already exists for ${PR_SLUG}; skipping certbot issue step"
            else
              sleep 2
              sudo certbot --nginx \
                -d "${PR_SLUG}.staging.newlevelhub.kz" \
                --non-interactive \
                --agree-tos \
                -m "admin@newlevelhub.kz" \
                --redirect \
                2>&1 | tail -10
            fi

            echo ""
            echo "=== Preview deployed successfully ==="
            echo "URL:    https://${PR_SLUG}.staging.newlevelhub.kz"
            echo "Docs:   https://${PR_SLUG}.staging.newlevelhub.kz/api/docs/"
            echo "Port:   ${PREVIEW_PORT}"

      - name: Post preview URL comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const branch = '${{ github.head_ref }}';
            const ticketMatch = branch.match(/dev-\d+/);
            const ticket = ticketMatch ? ticketMatch[0] : 'noticket';
            const slug = `be-${ticket}-pr${prNumber}`;
            const baseUrl = `https://${slug}.staging.newlevelhub.kz`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);

            const body = [
              `## 🚀 Preview Environment`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Status** | ✅ Deployed |`,
              `| **API Base** | \`${baseUrl}/api/v1/\` |`,
              `| **Swagger** | [${baseUrl}/api/docs/](${baseUrl}/api/docs/) |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Commit** | \`${sha}\` |`,
              ``,
              `> Preview автоматически удалится когда PR будет закрыт.`,
              ``,
              `[View deploy run](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## 🚀 Preview Environment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  destroy_preview:
    name: Destroy PR preview
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.fork == false
    environment: staging

    steps:
      - name: Destroy preview via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPOSITORY,DEPLOY_PATH,PR_NUMBER,BRANCH_NAME
          script: |
            set -e

            TICKET=$(echo "$BRANCH_NAME" | grep -oE 'dev-[0-9]+' | head -1)
            if [ -z "$TICKET" ]; then TICKET="noticket"; fi
            PR_SLUG="be-${TICKET}-pr${PR_NUMBER}"
            PREVIEW_PORT=$((10000 + PR_NUMBER))
            PREVIEW_DB_NAME="nlh_pr${PR_NUMBER}"
            NGINX_CONF="/etc/nginx/sites-available/${PR_SLUG}.staging.newlevelhub.kz"

            IMAGE_PATH="$DOCKER_REPOSITORY"
            if [[ "$IMAGE_PATH" != */* ]]; then
              IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
            fi
            BACKEND_IMAGE="${DOCKER_REGISTRY}/${IMAGE_PATH}:pr-${PR_NUMBER}"

            COMPOSE_FILE="$DEPLOY_PATH/docker-compose.${PR_SLUG}.yml"

            echo "--- [1/6] Dropping PR database ---"
            cd "$DEPLOY_PATH"
            PG_USER=$(grep -E '^POSTGRES_USER=' .env.staging | head -1 | cut -d= -f2 | tr -d "' \"")
            PG_USER="${PG_USER:-nlh_user}"

            # Terminate active connections so DROP DATABASE won't be blocked
            docker exec nlh_staging_postgres psql -U "$PG_USER" -d postgres -c \
              "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='$PREVIEW_DB_NAME' AND pid <> pg_backend_pid();" \
              2>/dev/null || true
            docker exec nlh_staging_postgres psql -U "$PG_USER" -d postgres \
              -c "DROP DATABASE IF EXISTS $PREVIEW_DB_NAME;" \
              2>/dev/null || echo "WARNING: Could not drop database $PREVIEW_DB_NAME"

            echo "--- [2/6] Stopping Docker containers ---"
            if [ -f "$COMPOSE_FILE" ]; then
              export PR_SLUG PREVIEW_DB_NAME BACKEND_IMAGE PREVIEW_PORT
              docker compose \
                --project-name "$PR_SLUG" \
                --env-file .env.staging \
                -f "$COMPOSE_FILE" \
                down -v --remove-orphans \
                || echo "WARNING: compose down failed, proceeding with fallback"
              rm -f "$COMPOSE_FILE"
            fi

            echo "--- [3/6] Fallback: remove leftover resources ---"
            CONTAINERS=$(docker ps -a --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$CONTAINERS" ]; then
              docker stop $CONTAINERS 2>/dev/null || true
              docker rm -f $CONTAINERS 2>/dev/null || true
            fi
            VOLUMES=$(docker volume ls --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$VOLUMES" ]; then
              docker volume rm -f $VOLUMES 2>/dev/null || true
            fi
            NETWORKS=$(docker network ls --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$NETWORKS" ]; then
              docker network rm $NETWORKS 2>/dev/null || true
            fi

            echo "--- [4/6] Removing nginx config ---"
            sudo rm -f "$NGINX_CONF" "/etc/nginx/sites-enabled/${PR_SLUG}.staging.newlevelhub.kz"
            sudo nginx -t && sudo nginx -s reload

            echo "--- [5/6] Deleting SSL certificate ---"
            sudo certbot delete \
              --cert-name "${PR_SLUG}.staging.newlevelhub.kz" \
              --non-interactive \
              2>/dev/null || echo "Cert not found or already deleted."

            echo "--- [6/6] Cleaning up Docker image ---"
            docker rmi "$BACKEND_IMAGE" 2>/dev/null || echo "Image not found or already removed."

            echo ""
            echo "=== Preview destroyed: ${PR_SLUG} ==="

      - name: Delete PR image from registry
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          IMAGE_PATH="$DOCKER_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi
          TAG="pr-${PR_NUMBER}"

          # Docker Hub API delete (works for hub.docker.com registry)
          if [[ "$DOCKER_REGISTRY" == "docker.io" ]] || [[ -z "$DOCKER_REGISTRY" ]] || [[ "$DOCKER_REGISTRY" == "registry-1.docker.io" ]]; then
            TOKEN=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"${DOCKER_USERNAME}\", \"password\": \"${DOCKER_PASSWORD}\"}" \
              "https://hub.docker.com/v2/users/login/" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
            if [ -n "$TOKEN" ]; then
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT ${TOKEN}" \
                "https://hub.docker.com/v2/repositories/${IMAGE_PATH}/tags/${TAG}/")
              echo "Registry delete status: ${HTTP_STATUS}"
            else
              echo "WARNING: Could not obtain registry token — image tag not deleted from registry"
            fi
          else
            echo "Non-Docker Hub registry detected — skipping automated tag deletion (manual cleanup required)"
          fi

      - name: Update PR comment on destroy
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const merged = '${{ github.event.pull_request.merged }}' === 'true';
            const action = merged ? 'merged ✅' : 'closed';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## 🚀 Preview Environment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: existing.body
                  .replace('✅ Deployed', `🗑️ Destroyed (PR ${action})`)
                  .replace('> Preview автоматически удалится когда PR будет закрыт.', ''),
              });
            }

  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: [changes, lint, tests, build_and_push, deploy_preview]
    if: |
      always() &&
      github.event.pull_request.draft == false &&
      github.event.action != 'closed'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: Compute preview slug
        id: slug
        run: |
          BRANCH="${{ github.head_ref }}"
          TICKET=$(echo "$BRANCH" | grep -oE 'dev-[0-9]+' | head -1)
          if [ -z "$TICKET" ]; then TICKET="noticket"; fi
          echo "pr_slug=be-${TICKET}-pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Send Slack message
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.changes.outputs.deploy_changed == 'false' && ':fast_forward: Heavy CI skipped (no deploy-impacting changes)' || needs.deploy_preview.result == 'success' && ':rocket: Preview deployed' || needs.tests.result == 'success' && needs.lint.result == 'success' && needs.deploy_preview.result == 'skipped' && ':white_check_mark: Tests passed (fork — no preview)' || needs.build_and_push.result == 'success' && needs.deploy_preview.result == 'skipped' && ':white_check_mark: Build passed (deploy skipped)' || needs.build_and_push.result == 'success' && needs.deploy_preview.result == 'failure' && ':warning: Built OK but preview deploy failed' || ':x: CI FAILED' }} *${{ github.repository }}*\n*Branch:* `${{ github.head_ref }}`\n*PR:* ${{ github.event.pull_request.title }}\n*Actor:* ${{ github.actor }}\n*Preview:* https://${{ steps.slug.outputs.pr_slug }}.staging.newlevelhub.kz\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
