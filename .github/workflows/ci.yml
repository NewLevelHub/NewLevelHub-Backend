name: Backend CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  LATEST_TAG: latest

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run linting
        run: flake8 apps/ config/ --max-line-length=120 --exclude=migrations

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          SECRET_KEY: test-secret-key
        run: |
          python manage.py migrate
          pytest --cov-report=xml

  build_and_push:
    name: Build and push Docker image
    needs: quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false

    steps:
      - uses: actions/checkout@v4

      - name: Build image reference
        id: image_meta
        run: |
          IMAGE_PATH="$IMAGE_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi
          # Extract ticket key like "DEV-17" from PR title or branch name.
          SHORT_SHA="${GITHUB_SHA::7}"
          TICKET="$(echo "${{ github.event.pull_request.title }}" | grep -Eo '[A-Za-z]+-[0-9]+' | head -n1 || true)"
          if [[ -z "$TICKET" ]]; then
            TICKET="$(echo "${{ github.head_ref }}" | grep -Eo '[A-Za-z]+-[0-9]+' | head -n1 || true)"
          fi
          TICKET="${TICKET:-TICKET}"
          TICKET="$(echo "$TICKET" | tr '[:lower:]' '[:upper:]')"

          PR_TAG="${TICKET}-pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"

          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/${IMAGE_PATH}"
          echo "pr_image_ref=${IMAGE_NAME}:${PR_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_image_ref=${IMAGE_NAME}:${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.pr_image_ref }}
            ${{ steps.image_meta.outputs.latest_image_ref }}

  notify:
    runs-on: ubuntu-latest
    needs: [build_and_push]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.build_and_push.result == 'success' && '✅ SUCCESS' || '❌ FAILURE' }} *${{ github.repository }}*\n*Branch:* `${{ github.head_ref != '' && github.head_ref || github.ref_name }}`\n*Actor:* ${{ github.actor }}${{ github.event_name == 'pull_request' && format('\n*PR:* {0} by {1}', github.event.pull_request.title, github.event.pull_request.user.login) || '' }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
