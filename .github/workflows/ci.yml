name: Backend CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run linting
        run: flake8 apps/ config/ --max-line-length=120 --exclude=migrations

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          SECRET_KEY: test-secret-key
        run: |
          python manage.py migrate
          pytest --cov-report=xml

  build_and_push:
    name: Build and push Docker image
    needs: quality
    runs-on: ubuntu-latest
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false

    steps:
      - uses: actions/checkout@v6

      - name: Build image reference
        id: image_meta
        run: |
          IMAGE_PATH="$IMAGE_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"
          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/${IMAGE_PATH}"

          echo "image_ref=${IMAGE_NAME}:pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.image_ref }}

  deploy_preview:
    name: Deploy PR preview
    needs: build_and_push
    runs-on: ubuntu-latest
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    environment: staging

    steps:
      - uses: actions/checkout@v6

      - name: Copy compose template and nginx config to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.preview.yml,nginx/preview.conf"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy preview via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPOSITORY,DEPLOY_PATH,PR_NUMBER,BRANCH_NAME
          script: |
            set -e

            TICKET=$(echo "$BRANCH_NAME" | grep -oE 'dev-[0-9]+' | head -1)
            if [ -z "$TICKET" ]; then TICKET="noticket"; fi
            PR_SLUG="be-${TICKET}-pr${PR_NUMBER}"
            PREVIEW_PORT=$((10000 + PR_NUMBER))
            if [ "$PREVIEW_PORT" -gt 10999 ]; then
              echo "ERROR: PR number ${PR_NUMBER} exceeds port range (max port 10999). Refusing to deploy."
              exit 1
            fi
            if ss -tlnp 2>/dev/null | grep -q ":${PREVIEW_PORT} " || \
               ss -tlnp 2>/dev/null | grep -q ":${PREVIEW_PORT}$"; then
              echo "WARNING: port ${PREVIEW_PORT} appears to be in use — checking if it belongs to this PR..."
              if ! docker compose --project-name "$PR_SLUG" ps 2>/dev/null | grep -q "Up"; then
                echo "ERROR: port ${PREVIEW_PORT} is occupied by another process. Refusing to deploy."
                exit 1
              fi
            fi
            PREVIEW_DB_NAME="nlh_pr${PR_NUMBER}"
            NGINX_CONF="/etc/nginx/sites-available/${PR_SLUG}.staging.newlevelhub.kz"

            # Build image ref locally to avoid GitHub Actions masked-output issue
            IMAGE_PATH="$DOCKER_REPOSITORY"
            if [[ "$IMAGE_PATH" != */* ]]; then
              IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
            fi
            BACKEND_IMAGE="${DOCKER_REGISTRY}/${IMAGE_PATH}:pr-${PR_NUMBER}"

            COMPOSE_FILE="$DEPLOY_PATH/docker-compose.${PR_SLUG}.yml"

            echo "--- [0/5] Copying compose template for ${PR_SLUG} ---"
            mkdir -p "$DEPLOY_PATH"
            cp "$DEPLOY_PATH/docker-compose.preview.yml" "$COMPOSE_FILE"

            echo "--- [1/5] Docker: pull & deploy containers ---"
            echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
            unset DOCKER_PASSWORD
            cd "$DEPLOY_PATH"

            if [ ! -f ".env.staging" ]; then
              echo "ERROR: .env.staging not found in $DEPLOY_PATH"
              exit 1
            fi

            docker pull "$BACKEND_IMAGE"

            export PR_SLUG PREVIEW_DB_NAME BACKEND_IMAGE PREVIEW_PORT
            docker compose \
              --project-name "$PR_SLUG" \
              --env-file .env.staging \
              -f "$COMPOSE_FILE" \
              up -d --force-recreate

            echo "--- [2/4] Waiting for backend to finish startup (migrate + collectstatic + gunicorn) ---"
            BACKEND_CONTAINER="${PR_SLUG}-backend-1"
            DB_CONTAINER="${PR_SLUG}-db-1"
            for i in $(seq 1 60); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$BACKEND_CONTAINER" 2>/dev/null || echo "none")
              IS_RUNNING=$(docker inspect --format='{{.State.Running}}' "$BACKEND_CONTAINER" 2>/dev/null || echo "false")
              # backend has no healthcheck — poll gunicorn port instead
              if docker exec "$BACKEND_CONTAINER" sh -c 'nc -z localhost 8000' >/dev/null 2>&1; then
                echo "Backend is ready after ${i}s"
                break
              fi
              if [ "$IS_RUNNING" != "true" ]; then
                echo "ERROR: backend container stopped unexpectedly"
                docker compose --project-name "$PR_SLUG" -f "$COMPOSE_FILE" logs backend | tail -30
                exit 1
              fi
              echo "Waiting for backend... (${i}/60)"
              sleep 3
            done

            echo "--- [3/4] Writing nginx config ---"
            sudo tee "$NGINX_CONF" > /dev/null << NGINXEOF
            server {
                listen 80;
                server_name ${PR_SLUG}.staging.newlevelhub.kz;

                location / {
                    proxy_pass http://127.0.0.1:${PREVIEW_PORT};
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 300;
                    client_max_body_size 20M;
                }
            }
            NGINXEOF

            sudo ln -sf "$NGINX_CONF" "/etc/nginx/sites-enabled/${PR_SLUG}.staging.newlevelhub.kz"
            sudo nginx -t && sudo nginx -s reload

            echo "--- [4/4] Getting SSL certificate ---"
            sleep 2
            sudo certbot --nginx \
              -d "${PR_SLUG}.staging.newlevelhub.kz" \
              --non-interactive \
              --agree-tos \
              -m "admin@newlevelhub.kz" \
              --redirect \
              2>&1 | tail -10

            echo ""
            echo "=== Preview deployed successfully ==="
            echo "URL:    https://${PR_SLUG}.staging.newlevelhub.kz"
            echo "Docs:   https://${PR_SLUG}.staging.newlevelhub.kz/api/docs/"
            echo "Port:   ${PREVIEW_PORT}"

      - name: Post preview URL comment to PR
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.issue.number;
            const branch = '${{ github.head_ref }}';
            const ticketMatch = branch.match(/dev-\d+/);
            const ticket = ticketMatch ? ticketMatch[0] : 'noticket';
            const slug = `be-${ticket}-pr${prNumber}`;
            const baseUrl = `https://${slug}.staging.newlevelhub.kz`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);

            const body = [
              `## 🚀 Preview Environment`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Status** | ✅ Deployed |`,
              `| **API Base** | \`${baseUrl}/api/v1/\` |`,
              `| **Swagger** | [${baseUrl}/api/docs/](${baseUrl}/api/docs/) |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Commit** | \`${sha}\` |`,
              ``,
              `> Preview автоматически удалится когда PR будет закрыт.`,
              ``,
              `[View deploy run](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## 🚀 Preview Environment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  destroy_preview:
    name: Destroy PR preview
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.fork == false
    environment: staging

    steps:
      - name: Destroy preview via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPOSITORY,DEPLOY_PATH,PR_NUMBER,BRANCH_NAME
          script: |
            set -e

            TICKET=$(echo "$BRANCH_NAME" | grep -oE 'dev-[0-9]+' | head -1)
            if [ -z "$TICKET" ]; then TICKET="noticket"; fi
            PR_SLUG="be-${TICKET}-pr${PR_NUMBER}"
            PREVIEW_PORT=$((10000 + PR_NUMBER))
            PREVIEW_DB_NAME="nlh_pr${PR_NUMBER}"
            NGINX_CONF="/etc/nginx/sites-available/${PR_SLUG}.staging.newlevelhub.kz"

            IMAGE_PATH="$DOCKER_REPOSITORY"
            if [[ "$IMAGE_PATH" != */* ]]; then
              IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
            fi
            BACKEND_IMAGE="${DOCKER_REGISTRY}/${IMAGE_PATH}:pr-${PR_NUMBER}"

            COMPOSE_FILE="$DEPLOY_PATH/docker-compose.${PR_SLUG}.yml"

            echo "--- [1/5] Stopping Docker containers ---"
            cd "$DEPLOY_PATH"
            if [ -f "$COMPOSE_FILE" ]; then
              export PR_SLUG PREVIEW_DB_NAME BACKEND_IMAGE PREVIEW_PORT
              docker compose \
                --project-name "$PR_SLUG" \
                --env-file .env.staging \
                -f "$COMPOSE_FILE" \
                down -v --remove-orphans \
                || echo "WARNING: compose down failed, proceeding with fallback"
              rm -f "$COMPOSE_FILE"
            fi

            echo "--- [2/5] Fallback: remove leftover resources ---"
            CONTAINERS=$(docker ps -a --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$CONTAINERS" ]; then
              docker stop $CONTAINERS 2>/dev/null || true
              docker rm -f $CONTAINERS 2>/dev/null || true
            fi
            VOLUMES=$(docker volume ls --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$VOLUMES" ]; then
              docker volume rm -f $VOLUMES 2>/dev/null || true
            fi
            NETWORKS=$(docker network ls --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$NETWORKS" ]; then
              docker network rm $NETWORKS 2>/dev/null || true
            fi

            echo "--- [3/5] Removing nginx config ---"
            sudo rm -f "$NGINX_CONF" "/etc/nginx/sites-enabled/${PR_SLUG}.staging.newlevelhub.kz"
            sudo nginx -t && sudo nginx -s reload

            echo "--- [4/5] Deleting SSL certificate ---"
            sudo certbot delete \
              --cert-name "${PR_SLUG}.staging.newlevelhub.kz" \
              --non-interactive \
              2>/dev/null || echo "Cert not found or already deleted."

            echo "--- [5/5] Cleaning up Docker image ---"
            docker rmi "$BACKEND_IMAGE" 2>/dev/null || echo "Image not found or already removed."

            echo ""
            echo "=== Preview destroyed: ${PR_SLUG} ==="

      - name: Delete PR image from registry
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          IMAGE_PATH="$DOCKER_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi
          TAG="pr-${PR_NUMBER}"

          # Docker Hub API delete (works for hub.docker.com registry)
          if [[ "$DOCKER_REGISTRY" == "docker.io" ]] || [[ -z "$DOCKER_REGISTRY" ]] || [[ "$DOCKER_REGISTRY" == "registry-1.docker.io" ]]; then
            TOKEN=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"${DOCKER_USERNAME}\", \"password\": \"${DOCKER_PASSWORD}\"}" \
              "https://hub.docker.com/v2/users/login/" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
            if [ -n "$TOKEN" ]; then
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT ${TOKEN}" \
                "https://hub.docker.com/v2/repositories/${IMAGE_PATH}/tags/${TAG}/")
              echo "Registry delete status: ${HTTP_STATUS}"
            else
              echo "WARNING: Could not obtain registry token — image tag not deleted from registry"
            fi
          else
            echo "Non-Docker Hub registry detected — skipping automated tag deletion (manual cleanup required)"
          fi

      - name: Update PR comment on destroy
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.issue.number;
            const merged = '${{ github.event.pull_request.merged }}' === 'true';
            const action = merged ? 'merged ✅' : 'closed';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## 🚀 Preview Environment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: existing.body
                  .replace('✅ Deployed', `🗑️ Destroyed (PR ${action})`)
                  .replace('> Preview автоматически удалится когда PR будет закрыт.', ''),
              });
            }

  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: [quality, build_and_push, deploy_preview]
    if: |
      always() &&
      github.event.pull_request.draft == false &&
      github.event.action != 'closed'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: Compute preview slug
        id: slug
        run: |
          BRANCH="${{ github.head_ref }}"
          TICKET=$(echo "$BRANCH" | grep -oE 'dev-[0-9]+' | head -1)
          if [ -z "$TICKET" ]; then TICKET="noticket"; fi
          echo "pr_slug=be-${TICKET}-pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Send Slack message
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v3.0.1
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.deploy_preview.result == 'success' && ':rocket: Preview deployed' || needs.quality.result == 'success' && needs.deploy_preview.result == 'skipped' && ':white_check_mark: Tests passed (fork — no preview)' || needs.build_and_push.result == 'success' && ':warning: Built OK but preview deploy failed' || ':x: CI FAILED' }} *${{ github.repository }}*\n*Branch:* `${{ github.head_ref }}`\n*PR:* ${{ github.event.pull_request.title }}\n*Actor:* ${{ github.actor }}\n*Preview:* https://${{ steps.slug.outputs.pr_slug }}.staging.newlevelhub.kz\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
